[package]
name = "openparts-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "OpenParts distribution API server (Architecture Specification section 20)."

[dependencies]
openparts-core = { path = "../openparts/crates/openparts-core" }
openparts-data = { path = "../openparts/crates/openparts-data" }
openparts-validator = { path = "../openparts/crates/openparts-validator" }
openparts-mcad = { path = "../openparts/crates/mcad/openparts-mcad" }
openparts-step = { path = "../openparts/crates/mcad/openparts-step" }
openparts-stl = { path = "../openparts/crates/mcad/openparts-stl" }
openparts-pcbcad = { path = "../openparts/crates/pcbcad/openparts-pcbcad" }
openparts-kicad = { path = "../openparts/crates/pcbcad/openparts-kicad" }

axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
